<!DOCTYPE html>
<html lang="tl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wattpad-style Digital Novel Platform</title>
    <!-- StPageFlip Library para sa 3D Flip Book Effect -->
    <script src="https://cdn.jsdelivr.net/npm/page-flip@2.0.7/dist/js/page-flip.browser.js"></script>
    <!-- Mammoth.js para sa pagbasa ng .docx Word Files -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/mammoth/1.6.0/mammoth.browser.min.js"></script>
    
    <style>
        :root {
            --wattpad-orange: #ff5000;
            --wattpad-dark: #1a1a1a;
            --bg-color: #f8f9fa;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            margin: 0;
            display: flex;
            flex-direction: column;
            height: 100vh;
            overflow: hidden;
        }

        .hidden {
            display: none !important;
        }

        .navbar {
            background-color: white;
            padding: 12px 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #e0e0e0;
            box-shadow: 0 2px 5px rgba(0,0,0,0.05);
            z-index: 10;
        }

        .logo {
            font-size: 22px;
            font-weight: bold;
            color: var(--wattpad-orange);
            cursor: pointer;
        }

        .nav-right {
            display: flex;
            gap: 15px;
            align-items: center;
        }

        .btn-wattpad {
            background-color: var(--wattpad-orange);
            color: white;
            border: none;
            padding: 8px 16px;
            border-radius: 20px;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.2s;
        }
        .btn-wattpad:hover {
            background-color: #e04500;
        }

        .btn-outline {
            background-color: transparent;
            color: #555;
            border: 1px solid #ccc;
            padding: 8px 16px;
            border-radius: 20px;
            cursor: pointer;
        }
        .btn-outline:hover {
            background-color: #eee;
        }

        .main-content {
            flex: 1;
            overflow-y: auto;
            padding: 30px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .auth-wrapper {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100%;
            width: 100%;
        }

        .auth-card {
            background: white;
            padding: 40px;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.1);
            width: 320px;
            text-align: center;
        }
        .auth-card h2 {
            color: var(--wattpad-dark);
            margin-bottom: 20px;
        }
        .auth-card input {
            width: 100%;
            padding: 12px;
            margin: 10px 0;
            border: 1px solid #ddd;
            border-radius: 6px;
            box-sizing: border-box;
        }
        .auth-card button {
            width: 100%;
            padding: 12px;
            background-color: var(--wattpad-orange);
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 16px;
            cursor: pointer;
            margin-top: 10px;
        }

        .library-container {
            width: 100%;
            max-width: 1000px;
        }

        .section-title {
            font-size: 20px;
            font-weight: bold;
            color: #333;
            margin-bottom: 20px;
            border-left: 4px solid var(--wattpad-orange);
            padding-left: 10px;
        }

        .books-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
            gap: 20px;
        }

        .book-card {
            background: white;
            border-radius: 8px;
            box-shadow: 0 3px 10px rgba(0,0,0,0.08);
            overflow: hidden;
            transition: transform 0.2s, box-shadow 0.2s;
            display: flex;
            flex-direction: column;
            position: relative;
        }
        .book-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 6px 15px rgba(0,0,0,0.15);
        }

        .book-cover-art {
            height: 200px;
            background: linear-gradient(135deg, #ff7e5f, #feb47b);
            color: white;
            display: flex;
            flex-direction: column;
            justify-content: flex-end;
            padding: 15px;
            box-sizing: border-box;
            text-shadow: 1px 1px 3px rgba(0,0,0,0.4);
            cursor: pointer;
        }

        .book-info {
            padding: 10px 12px;
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        .book-title {
            font-size: 14px;
            font-weight: bold;
            color: #333;
            margin: 0 0 3px 0;
            overflow: hidden;
            text-overflow: ellipsis;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            cursor: pointer;
        }

        .book-author {
            font-size: 11px;
            color: #777;
            margin: 0 0 8px 0;
        }

        .card-actions {
            display: flex;
            gap: 5px;
            border-top: 1px solid #eee;
            padding-top: 8px;
        }

        .card-actions button {
            flex: 1;
            padding: 4px;
            font-size: 11px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-weight: bold;
        }

        .btn-edit { background-color: #ff9800; color: white; }
        .btn-edit:hover { background-color: #f57c00; }
        
        .btn-delete { background-color: #f44336; color: white; }
        .btn-delete:hover { background-color: #d32f2f; }

        .upload-section {
            background: white;
            padding: 20px;
            border-radius: 8px;
            margin-bottom: 30px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.05);
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .book-wrapper {
            box-shadow: 0 15px 35px rgba(0,0,0,0.3);
            border-radius: 5px;
        }

        .page {
            background-color: #fdfbf7;
            color: #333;
            padding: 30px;
            box-sizing: border-box;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            border-left: 1px solid #e0dcd0;
            overflow-y: auto;
        }

        .page-cover {
            background: linear-gradient(135deg, var(--wattpad-dark), #333);
            color: white;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 50px;
        }

        .page h3 {
            color: var(--wattpad-orange);
            border-bottom: 2px solid var(--wattpad-orange);
            padding-bottom: 5px;
            margin-top: 0;
        }

        .page p {
            font-size: 13px;
            line-height: 1.6;
            text-align: justify;
        }

        .page-footer {
            font-size: 11px;
            color: #888;
            text-align: center;
            border-top: 1px solid #eee;
            padding-top: 8px;
        }

        .controls {
            margin-top: 15px;
            display: flex;
            gap: 15px;
            align-items: center;
        }
        .controls button {
            padding: 8px 16px;
            background-color: var(--wattpad-dark);
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 14px;
        }
        span#page-info {
            color: #333;
            font-weight: bold;
            font-size: 14px;
        }
    </style>
</head>
<body>

    <div class="navbar">
        <div class="logo" onclick="goToHome()">Wattnovel</div>
        <div class="nav-right" id="navRight"></div>
    </div>

    <div class="main-content" id="mainContent">

        <div id="authView" class="auth-wrapper">
            <div class="auth-card" id="loginCard">
                <h2>Mag-log in</h2>
                <input type="text" id="username" placeholder="Username">
                <input type="password" id="password" placeholder="Password">
                <button onclick="handleLogin()">Mag-log in</button>
                <p id="errorMsg" style="color: red; font-size: 13px; margin-top: 10px;"></p>
                <p style="font-size: 13px; margin-top: 15px;">Wala pang account? <a href="#" onclick="toggleAuthForm('register')" style="color: var(--wattpad-orange);">Mag-register</a></p>
                <div style="font-size: 11px; color: #888; margin-top: 10px;">Author: <b>author</b> / <b>12345</b></div>
            </div>

            <div class="auth-card hidden" id="registerCard">
                <h2>Gumawa ng Account</h2>
                <input type="text" id="regUsername" placeholder="Bagong Username">
                <input type="password" id="regPassword" placeholder="Bagong Password">
                <button onclick="handleRegister()">I-register</button>
                <p id="regMsg" style="color: green; font-size: 13px; margin-top: 10px;"></p>
                <p style="font-size: 13px; margin-top: 15px;">May account na? <a href="#" onclick="toggleAuthForm('login')" style="color: var(--wattpad-orange);">Mag-log in</a></p>
            </div>
        </div>

        <div id="libraryView" class="library-container hidden">
            <div id="authorUploadSection" class="upload-section hidden">
                <div>
                    <b>Mag-upload ng Bagong Kwento (Word .docx)</b>
                    <p style="font-size: 12px; color: #666; margin: 3px 0 0 0;">Idagdag ang iyong nobela sa library para mabasa ng lahat.</p>
                </div>
                <div style="display: flex; gap: 10px; align-items: center;">
                    <input type="file" id="wordFile" accept=".docx" style="font-size: 13px;">
                    <button class="btn-wattpad" onclick="handleUploadNewBook()">I-publish</button>
                </div>
            </div>

            <div class="section-title">Mga Sikat na Kwento sa Library</div>
            <div class="books-grid" id="booksGrid"></div>
        </div>

        <div id="readingView" class="hidden" style="width: 100%; height: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center;">
            <div class="book-wrapper">
                <div id="book"></div>
            </div>

            <div class="controls">
                <button onclick="if(pageFlip) pageFlip.flipPrev()">❮ Nakaraan</button>
                <span id="page-info">Pahina: 1 / 1</span>
                <button onclick="if(pageFlip) pageFlip.flipNext()">Susunod ❯</button>
            </div>
        </div>

    </div>

    <script>
        let pageFlip = null;
        let currentUser = null;

        if (!localStorage.getItem("usersList")) {
            const initialUsers = [{ user: "author", pass: "12345", role: "author" }];
            localStorage.setItem("usersList", JSON.stringify(initialUsers));
        }

        if (!localStorage.getItem("booksLibrary")) {
            const defaultBooks = [
                {
                    title: "Ang Alamat ng Ating Pag-ibig",
                    author: "author",
                    pages: [
                        `<h3>Kabanata 1</h3><p>Sa isang malayong nayon kung saan ang mga bituin ay tila kumikinang nang mas malapit, nagsimula ang ating kwento...</p>`,
                        `<h3>Kabanata 2</h3><p>Hindi inaasahan ni Juan na ang simpleng paglakad na iyon sa gubat ay babago sa buong takbo ng kanyang buhay magpakailanman.</p>`
                    ]
                }
            ];
            localStorage.setItem("booksLibrary", JSON.stringify(defaultBooks));
        }

        function toggleAuthForm(type) {
            if (type === 'register') {
                document.getElementById("loginCard").classList.add("hidden");
                document.getElementById("registerCard").classList.remove("hidden");
            } else {
                document.getElementById("registerCard").classList.add("hidden");
                document.getElementById("loginCard").classList.remove("hidden");
            }
        }

        function handleRegister() {
            const newU = document.getElementById("regUsername").value.trim();
            const newP = document.getElementById("regPassword").value.trim();
            const regMsg = document.getElementById("regMsg");

            if (!newU || !newP) {
                alert("Punan ang lahat ng espasyo!");
                return;
            }

            let users = JSON.parse(localStorage.getItem("usersList"));
            if (users.some(u => u.user === newU)) {
                alert("May gumagamit na ng username na ito!");
                return;
            }

            users.push({ user: newU, pass: newP, role: "reader" });
            localStorage.setItem("usersList", JSON.stringify(users));

            regMsg.textContent = "Tagumpay ang paggawa ng account! Pwede nang mag-login.";
            setTimeout(() => toggleAuthForm('login'), 1500);
        }

        function handleLogin() {
            const userInput = document.getElementById("username").value.trim();
            const passInput = document.getElementById("password").value.trim();

            let users = JSON.parse(localStorage.getItem("usersList"));
            const foundUser = users.find(u => u.user === userInput && u.pass === passInput);

            if (foundUser) {
                currentUser = foundUser;
                showLibraryView();
            } else {
                document.getElementById("errorMsg").textContent = "Maling username o password!";
            }
        }

        function showLibraryView() {
            document.getElementById("authView").classList.add("hidden");
            document.getElementById("readingView").classList.add("hidden");
            document.getElementById("libraryView").classList.remove("hidden");

            const navRight = document.getElementById("navRight");
            navRight.innerHTML = `
                <span style="font-size: 14px; font-weight: bold; color: #555;">Hi, ${currentUser.user}</span>
                <button class="btn-outline" onclick="handleLogout()">Mag-log out</button>
            `;

            if (currentUser.role === "author") {
                document.getElementById("authorUploadSection").classList.remove("hidden");
            } else {
                document.getElementById("authorUploadSection").classList.add("hidden");
            }

            renderBooksGrid();
        }

        function renderBooksGrid() {
            const books = JSON.parse(localStorage.getItem("booksLibrary"));
            const grid = document.getElementById("booksGrid");
            grid.innerHTML = "";

            books.forEach((book, index) => {
                const card = document.createElement("div");
                card.className = "book-card";

                // Pwede i-edit o i-delete kung author ang naka-login o siya ang may-ari ng libro
                let actionButtons = "";
                if (currentUser && currentUser.role === "author") {
                    actionButtons = `
                        <div class="card-actions">
                            <button class="btn-edit" onclick="handleEditBook(${index})">I-edit</button>
                            <button class="btn-delete" onclick="handleDeleteBook(${index})">Burahin</button>
                        </div>
                    `;
                }

                card.innerHTML = `
                    <div class="book-cover-art" onclick="openBook(${index})">
                        <span style="font-size: 11px; opacity: 0.8;">NOVEL</span>
                        <div style="font-size: 16px; font-weight: bold; margin-top: 5px;">${book.title}</div>
                    </div>
                    <div class="book-info">
                        <div>
                            <p class="book-title" onclick="openBook(${index})">${book.title}</p>
                            <p class="book-author">Ni: ${book.author || 'Author'}</p>
                        </div>
                        ${actionButtons}
                    </div>
                `;
                grid.appendChild(card);
            });
        }

        function goToHome() {
            if (!currentUser) return;
            showLibraryView();
        }

        function openBook(index) {
            document.getElementById("libraryView").classList.add("hidden");
            document.getElementById("readingView").classList.remove("hidden");

            const navRight = document.getElementById("navRight");
            navRight.innerHTML = `
                <button class="btn-outline" onclick="showLibraryView()">← Bumalik sa Library</button>
                <button class="btn-outline" onclick="handleLogout()">Mag-log out</button>
            `;

            renderFlipBook(index);
        }

        function renderFlipBook(bookIndex) {
            const books = JSON.parse(localStorage.getItem("booksLibrary"));
            const bookData = books[bookIndex];
            const bookElement = document.getElementById('book');

            if (pageFlip) {
                pageFlip.destroy();
                pageFlip = null;
            }

            let htmlContent = `
                <div class="page page-cover">
                    <h1 style="font-size: 24px; margin-bottom: 10px;">${bookData.title}</h1>
                    <p style="font-size: 14px; color: #ffab91;">Isinulat ni: ${bookData.author || 'Author'}</p>
                    <p style="margin-top: 40px; font-size: 12px; color: #ccc;">I-flip para simulan ang pagbasa.</p>
                </div>
            `;

            bookData.pages.forEach((pageText, idx) => {
                htmlContent += `
                    <div class="page">
                        ${pageText}
                        <div class="page-footer">Pahina ${idx + 2}</div>
                    </div>
                `;
            });

            htmlContent += `
                <div class="page page-cover">
                    <h1 style="font-size: 24px;">WAKAS</h1>
                    <p style="font-size: 13px; color: #ccc;">Salamat sa pagbabasa ng nobelang ito!</p>
                </div>
            `;

            bookElement.innerHTML = htmlContent;

            pageFlip = new St.PageFlip(document.getElementById('book'), {
                width: 380,
                height: 500,
                showCover: true,
                maxShadowOpacity: 0.5,
                mobileScrollSupport: true
            });

            pageFlip.loadFromHTML(document.querySelectorAll('.page'));
            
            pageFlip.on('flip', (e) => {
                const totalPages = pageFlip.getPageCount();
                document.getElementById('page-info').textContent = `Pahina: ${e.data + 1} / ${totalPages}`;
            });
        }

        function handleUploadNewBook() {
            const fileInput = document.getElementById("wordFile");
            const file = fileInput.files[0];
            if (!file) {
                alert("Mangyaring pumili muna ng Word (.docx) file!");
                return;
            }

            const reader = new FileReader();
            reader.onload = function(loadEvent) {
                const arrayBuffer = loadEvent.target.result;

                mammoth.extractRawText({ arrayBuffer: arrayBuffer })
                    .then(function(result) {
                        let text = result.value.trim();
                        if (!text) text = "Walang nakitang text sa Word file na ito.";
                        
                        const chunkSize = 800;
                        let pageChunks = [];
                        for (let i = 0; i < text.length; i += chunkSize) {
                            let chunkText = text.substring(i, i + chunkSize).replace(/\n/g, '<br>');
                            pageChunks.push(`<h3>Kabanata / Bahagi</h3><p>${chunkText}</p>`);
                        }

                        const newBookTitle = file.name.replace('.docx', '');
                        
                        let books = JSON.parse(localStorage.getItem("booksLibrary"));
                        books.push({ title: newBookTitle, author: currentUser.user, pages: pageChunks });
                        localStorage.setItem("booksLibrary", JSON.stringify(books));

                        fileInput.value = "";
                        renderBooksGrid();
                        alert("Tagumpay na nai-publish ang iyong kwento!");
                    })
                    .catch(function(err) {
                        alert("May error sa pagbasa ng Word file: " + err.message);
                    });
            };
            reader.readAsArrayBuffer(file);
        }

        function handleDeleteBook(index) {
            if (confirm("Sigurado ka bang gusto mong burahin ang kwentong ito?")) {
                let books = JSON.parse(localStorage.getItem("booksLibrary"));
                books.splice(index, 1);
                localStorage.setItem("booksLibrary", JSON.stringify(books));
                renderBooksGrid();
            }
        }

        function handleEditBook(index) {
            let books = JSON.parse(localStorage.getItem("booksLibrary"));
            let currentBook = books[index];

            let newTitle = prompt("I-edit ang pamagat ng aklat:", currentBook.title);
            if (newTitle !== null && newTitle.trim() !== "") {
                books[index].title = newTitle.trim();
                localStorage.setItem("booksLibrary", JSON.stringify(books));
                renderBooksGrid();
                alert("Tagumpay na na-update ang pamagat!");
            }
        }

        function handleLogout() {
            currentUser = null;
            document.getElementById("libraryView").classList.add("hidden");
            document.getElementById("readingView").classList.add("hidden");
            document.getElementById("authView").classList.remove("hidden");
            document.getElementById("username").value = "";
            document.getElementById("password").value = "";
            document.getElementById("navRight").innerHTML = "";
        }
    </script>
</body>
</html>
