<!DOCTYPE html>
<html lang="tl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aking Digital Novel Platform - Library</title>
    <!-- StPageFlip Library para sa 3D Flip Book Effect -->
    <script src="https://cdn.jsdelivr.net/npm/page-flip@2.0.7/dist/js/page-flip.browser.js"></script>
    <!-- Mammoth.js para sa pagbasa ng .docx Word Files -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/mammoth/1.6.0/mammoth.browser.min.js"></script>
    
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #2c3e50, #bdc3c7);
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
        }

        .hidden {
            display: none !important;
        }

        /* Login & Register Box Design */
        .login-container {
            background: #ffffff;
            padding: 40px;
            border-radius: 12px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.3);
            width: 320px;
            text-align: center;
        }
        .login-container h2 {
            margin-bottom: 20px;
            color: #2c3e50;
        }
        .login-container input {
            width: 100%;
            padding: 12px;
            margin: 10px 0;
            border: 1px solid #ccc;
            border-radius: 6px;
            box-sizing: border-box;
        }
        .login-container button {
            width: 100%;
            padding: 12px;
            background-color: #27ae60;
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 16px;
            cursor: pointer;
            margin-top: 10px;
            transition: background 0.3s;
        }
        .login-container button:hover {
            background-color: #219653;
        }
        .secondary-btn {
            background-color: #2980b9 !important;
            margin-top: 8px !important;
        }
        .secondary-btn:hover {
            background-color: #1f618d !important;
        }
        .error-msg {
            color: #e74c3c;
            font-size: 14px;
            margin-top: 10px;
        }
        .success-msg {
            color: #27ae60;
            font-size: 14px;
            margin-top: 10px;
        }
        .hint {
            font-size: 12px;
            color: #7f8c8d;
            margin-top: 15px;
        }

        /* Book Dashboard Design */
        #bookSection {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            width: 100%;
            height: 100%;
        }

        .dashboard-bar {
            background: white;
            padding: 10px 20px;
            border-radius: 8px;
            margin-bottom: 15px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.2);
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .book-wrapper {
            box-shadow: 0 15px 35px rgba(0,0,0,0.4);
            border-radius: 5px;
        }

        /* Mismong Pahina ng Libro */
        .page {
            background-color: #fdfbf7;
            color: #333;
            padding: 30px;
            box-sizing: border-box;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            border-left: 1px solid #e0dcd0;
            overflow-y: auto;
        }

        .page-cover {
            background: linear-gradient(135deg, #8e44ad, #34495e);
            color: white;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 50px;
        }

        .page-cover h1 {
            font-size: 26px;
            margin-bottom: 10px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.5);
        }

        .page h3 {
            color: #8e44ad;
            border-bottom: 2px solid #8e44ad;
            padding-bottom: 5px;
            margin-top: 0;
        }

        .page p {
            font-size: 13px;
            line-height: 1.5;
            text-align: justify;
        }

        .page-footer {
            font-size: 11px;
            color: #888;
            text-align: center;
            border-top: 1px solid #eee;
            padding-top: 8px;
        }

        /* Controls para sa Navigation */
        .controls {
            margin-top: 15px;
            display: flex;
            gap: 15px;
            align-items: center;
        }

        .controls button, .controls select {
            padding: 8px 16px;
            background-color: #34495e;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 14px;
        }
        .controls button:hover {
            background-color: #2c3e50;
        }
        .logout-btn {
            background-color: #c0392b !important;
        }
        .logout-btn:hover {
            background-color: #a93226 !important;
        }
        span#page-info {
            color: white;
            font-weight: bold;
            font-size: 14px;
        }
    </style>
</head>
<body>

    <!-- 1. LOCAL LOGIN SECTION -->
    <div id="loginSection" class="login-container">
        <h2>📖 Book Login</h2>
        <input type="text" id="username" placeholder="Username">
        <input type="password" id="password" placeholder="Password">
        <button onclick="handleLogin()">Mag-login</button>
        <button class="secondary-btn" onclick="showRegisterForm()">Gumawa ng Account (Register)</button>
        <p id="errorMsg" class="error-msg"></p>
        <div class="hint">Author Account: <b>author</b> / <b>12345</b></div>
    </div>

    <!-- 1.5. LOCAL REGISTER SECTION -->
    <div id="registerSection" class="login-container hidden">
        <h2>📝 Register Account</h2>
        <input type="text" id="regUsername" placeholder="Bagong Username">
        <input type="password" id="regPassword" placeholder="Bagong Password">
        <button onclick="handleRegister()" style="background-color: #2980b9;">I-save ang Account</button>
        <button class="secondary-btn" onclick="showLoginForm()" style="background-color: #7f8c8d !important;">Bumalik sa Login</button>
        <p id="regMsg" class="success-msg"></p>
    </div>

    <!-- 2. FLIP BOOK SECTION -->
    <div id="bookSection" class="hidden">
        
        <!-- Dashboard Bar: Book Selector & Author Upload Option -->
        <div class="dashboard-bar">
            <div>
                <label for="bookSelector" style="font-size: 13px; font-weight: bold; color: #333;">Piliin ang Libro:</label>
                <select id="bookSelector" onchange="switchBook(this.value)" style="padding: 6px; border-radius: 4px; border: 1px solid #ccc;"></select>
            </div>
            
            <!-- Makikita lang ng Author ang upload panel na ito -->
            <div id="authorUploadPanel" class="hidden" style="border-left: 2px solid #ddd; padding-left: 15px; display: flex; gap: 10px; align-items: center;">
                <input type="file" id="wordFile" accept=".docx" style="font-size: 12px;">
                <button onclick="handleUploadNewBook()" style="padding: 6px 12px; background: #27ae60; color: white; border: none; border-radius: 4px; cursor: pointer; font-size: 12px;">Magdagdag ng Libro</button>
            </div>
        </div>

        <div class="book-wrapper">
            <div id="book">
                <!-- Default Cover Page -->
                <div class="page page-cover">
                    <h1>Aking Digital na Library</h1>
                    <p>Pumili ng libro sa itaas upang simulan ang pagbasa.</p>
                </div>
            </div>
        </div>

        <!-- Book Navigation Controls -->
        <div class="controls">
            <button onclick="if(pageFlip) pageFlip.flipPrev()">❮ Nakaraan</button>
            <span id="page-info">Pahina: 1 / 1</span>
            <button onclick="if(pageFlip) pageFlip.flipNext()">Susunod ❯</button>
            <button class="logout-btn" onclick="handleLogout()">Mag-log out</button>
        </div>
    </div>

    <script>
        let pageFlip = null;

        // Default Users Setup
        if (!localStorage.getItem("usersList")) {
            const initialUsers = [{ user: "author", pass: "12345", role: "author" }];
            localStorage.setItem("usersList", JSON.stringify(initialUsers));
        }

        // Default Library Books Setup (kung wala pa)
        if (!localStorage.getItem("booksLibrary")) {
            const defaultBooks = [
                {
                    title: "Paunang Salita at Gabay",
                    pages: [
                        `<h3>Maligayang Pagdating!</h3><p>Ito ang iyong digital library kung saan maaari kang magdagdag at magbasa ng iba't ibang nobela gamit ang mga na-upload na Word files.</p>`,
                        `<h3>Paano Gamitin</h3><p>Bilang Author, gamitin ang button sa itaas upang mag-upload ng mga bagong kuwento. Ang mga mambabasa naman ay maaaring mamili ng kanilang babasahin.</p>`
                    ]
                }
            ];
            localStorage.setItem("booksLibrary", JSON.stringify(defaultBooks));
        }

        let currentUserRole = "reader";

        function showRegisterForm() {
            document.getElementById("loginSection").classList.add("hidden");
            document.getElementById("registerSection").classList.remove("hidden");
            document.getElementById("regMsg").textContent = "";
        }

        function showLoginForm() {
            document.getElementById("registerSection").classList.add("hidden");
            document.getElementById("loginSection").classList.remove("hidden");
            document.getElementById("errorMsg").textContent = "";
        }

        function handleRegister() {
            const newU = document.getElementById("regUsername").value.trim();
            const newP = document.getElementById("regPassword").value.trim();
            const regMsg = document.getElementById("regMsg");

            if (newU === "" || newP === "") {
                regMsg.className = "error-msg";
                regMsg.textContent = "Punan ang lahat ng espasyo!";
                return;
            }

            let users = JSON.parse(localStorage.getItem("usersList"));
            if (users.some(u => u.user === newU)) {
                regMsg.className = "error-msg";
                regMsg.textContent = "May gumagamit na ng username na ito!";
                return;
            }

            users.push({ user: newU, pass: newP, role: "reader" });
            localStorage.setItem("usersList", JSON.stringify(users));

            regMsg.className = "success-msg";
            regMsg.textContent = "Tagumpay ang paggawa ng account! Pwede na mag-login.";
            
            setTimeout(() => {
                showLoginForm();
                document.getElementById("username").value = newU;
            }, 1500);
        }

        function handleLogin() {
            const userInput = document.getElementById("username").value.trim();
            const passInput = document.getElementById("password").value.trim();
            const errorMsg = document.getElementById("errorMsg");

            let users = JSON.parse(localStorage.getItem("usersList"));
            const foundUser = users.find(u => u.user === userInput && u.pass === passInput);

            if (foundUser) {
                currentUserRole = foundUser.role;
                document.getElementById("loginSection").classList.add("hidden");
                document.getElementById("bookSection").classList.remove("hidden");

                if (currentUserRole === "author") {
                    document.getElementById("authorUploadPanel").classList.remove("hidden");
                } else {
                    document.getElementById("authorUploadPanel").classList.add("hidden");
                }

                loadLibrarySelector();
            } else {
                errorMsg.textContent = "Maling username o password!";
            }
        }

        function loadLibrarySelector() {
            const books = JSON.parse(localStorage.getItem("booksLibrary"));
            const selector = document.getElementById("bookSelector");
            selector.innerHTML = "";

            books.forEach((book, index) => {
                let opt = document.createElement("option");
                opt.value = index;
                opt.textContent = book.title;
                selector.appendChild(opt);
            });

            if (books.length > 0) {
                renderBook(0);
            }
        }

        function switchBook(index) {
            renderBook(index);
        }

        function renderBook(bookIndex) {
            const books = JSON.parse(localStorage.getItem("booksLibrary"));
            const bookData = books[bookIndex];
            const bookElement = document.getElementById('book');

            if (pageFlip) {
                pageFlip.destroy();
                pageFlip = null;
            }

            let htmlContent = `
                <div class="page page-cover">
                    <h1>${bookData.title}</h1>
                    <p>Digital Novel Library</p>
                    <p style="margin-top: 40px; font-size: 12px;">I-flip para simulan ang pagbasa.</p>
                </div>
            `;

            bookData.pages.forEach((pageText, idx) => {
                htmlContent += `
                    <div class="page">
                        ${pageText}
                        <div class="page-footer">Pahina ${idx + 2}</div>
                    </div>
                `;
            });

            htmlContent += `
                <div class="page page-cover">
                    <h1>WAKAS</h1>
                    <p>Salamat sa pagbabasa ng nobelang ito!</p>
                </div>
            `;

            bookElement.innerHTML = htmlContent;

            pageFlip = new St.PageFlip(document.getElementById('book'), {
                width: 380,
                height: 500,
                showCover: true,
                maxShadowOpacity: 0.5,
                mobileScrollSupport: true
            });

            pageFlip.loadFromHTML(document.querySelectorAll('.page'));
            
            pageFlip.on('flip', (e) => {
                const totalPages = pageFlip.getPageCount();
                document.getElementById('page-info').textContent = `Pahina: ${e.data + 1} / ${totalPages}`;
            });
        }

        function handleUploadNewBook() {
            const fileInput = document.getElementById("wordFile");
            const file = fileInput.files[0];
            if (!file) {
                alert("Mangyaring pumili muna ng Word (.docx) file!");
                return;
            }

            const reader = new FileReader();
            reader.onload = function(loadEvent) {
                const arrayBuffer = loadEvent.target.result;

                mammoth.extractRawText({ arrayBuffer: arrayBuffer })
                    .then(function(result) {
                        const text = result.value;
                        
                        // Hatiin sa chunks para sa mga pahina
                        const chunkSize = 800;
                        let pageChunks = [];
                        for (let i = 0; i < text.length; i += chunkSize) {
                            let chunkText = text.substring(i, i + chunkSize).replace(/\n/g, '<br>');
                            pageChunks.push(`<h3>Kabanata / Bahagi</h3><p>${chunkText}</p>`);
                        }

                        const newBookTitle = file.name.replace('.docx', '');
                        
                        let books = JSON.parse(localStorage.getItem("booksLibrary"));
                        books.push({ title: newBookTitle, pages: pageChunks });
                        localStorage.setItem("booksLibrary", JSON.stringify(books));

                        fileInput.value = "";
                        loadLibrarySelector();
                        // I-select ang bagong in-upload na libro
                        document.getElementById("bookSelector").value = books.length - 1;
                        renderBook(books.length - 1);

                        alert("Tagumpay na naidagdag ang bagong libro sa library!");
                    })
                    .catch(function(err) {
                        alert("May error sa pagbasa ng Word file: " + err);
                    });
            };
            reader.readAsArrayBuffer(file);
        }

        function handleLogout() {
            location.reload();
        }
    </script>

</body>
</html>
